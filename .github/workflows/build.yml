name: Build OpenWrt APK Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare feed directory
        run: |
          mkdir -p custom-feed/luci-app-jodu5164x-onyx
          cp -r root htdocs Makefile custom-feed/luci-app-jodu5164x-onyx/

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEED_DIR: ${{ github.workspace }}/custom-feed
          FEEDNAME: packages_ci
          PACKAGES: luci-app-jodu5164x-onyx
          NO_REFRESH_CHECK: true

      - name: Find built packages
        id: find_pkg
        run: |
          echo "Searching for built packages..."
          find bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) | head -20
          PKG_PATH=$(find bin/ -type f -name "luci-app-jodu5164x-onyx*" | head -1)
          if [ -n "$PKG_PATH" ]; then
            echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
            echo "pkg_name=$(basename "$PKG_PATH")" >> "$GITHUB_OUTPUT"
            echo "Found package: $PKG_PATH"
          else
            echo "::error::No built package found in bin/"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-jodu5164x-onyx
          path: |
            bin/**/*.apk
            bin/**/*.ipk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/**/*.apk
            bin/**/*.ipk
          fail_on_unmatched_files: false
          generate_release_notes: true
