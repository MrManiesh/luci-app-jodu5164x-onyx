name: Build OpenWrt APK Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEEDNAME: packages_ci
          PACKAGES: luci-app-jodu5164x-onyx
          NO_REFRESH_CHECK: true

      - name: Find built packages
        id: find_pkg
        run: |
          echo "Searching for built packages..."
          find bin/ -name "*.apk" -o -name "*.ipk" | head -20
          # Store the package path for later steps
          PKG_PATH=$(find bin/ -name "luci-app-jodu5164x-onyx*" -type f | head -1)
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$(basename $PKG_PATH)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-jodu5164x-onyx
          path: |
            bin/packages/*/packages_ci/*.apk
            bin/packages/*/packages_ci/*.ipk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/packages/*/packages_ci/*.apk
            bin/packages/*/packages_ci/*.ipk
          generate_release_notes: true
