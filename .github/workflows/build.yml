name: Build OpenWrt APK Package

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare feed directory
        run: |
          mkdir -p custom-feed/luci-app-jodu5164x-status
          cp -r root htdocs Makefile custom-feed/luci-app-jodu5164x-status/
          chmod -R 0755 custom-feed/luci-app-jodu5164x-status/root/etc/init.d
          chmod -R 0755 custom-feed/luci-app-jodu5164x-status/root/usr/libexec

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEED_DIR: ${{ github.workspace }}/custom-feed
          FEEDNAME: packages_ci
          PACKAGES: luci-app-jodu5164x-status
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: 1
          NO_DEFAULT_FEEDS: 1
          EXTRA_FEEDS: "src-git|luci|https://github.com/openwrt/luci.git;openwrt-24.10 src-git|packages|https://github.com/openwrt/packages.git;openwrt-24.10"

      - name: Collect package artifacts
        id: collect_pkg
        run: |
          mkdir -p dist
          find bin/ -type f -name "luci-app-jodu5164x-status*" -exec cp -v {} dist/ \;
          echo "=== Collected Package Files ==="
          ls -lh dist/
          PKG_FILE=$(ls dist/ | head -1)
          if [ -z "$PKG_FILE" ]; then
            echo "::error::No package matching luci-app-jodu5164x-status found!"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-jodu5164x-status
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
